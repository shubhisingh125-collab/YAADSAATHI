# netlify.toml
# Netlify Production Configuration for YaadSaathi

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Netlify Functions Configuration
[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]

# API Proxy: Route /api/saathi/chat to Netlify Serverless Function
[[redirects]]
  from = "/api/saathi/chat"
  to = "/.netlify/functions/chat"
  status = 200

# API Proxy: Route /api/health to Netlify Serverless Function
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/chat"
  status = 200

# Single Page App (SPA) fallback:
# Direct all non-file browser navigation routes (/games, /memory-match, /saathi, /daily-plan, /settings, /memories, etc.) to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

